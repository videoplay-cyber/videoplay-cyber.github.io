<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDHUB - Premium Video Streaming</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131822;
            --card-border: #1e2638;
            --primary-red: #e50914;
            --text-color: #ffffff;
            --text-muted: #9aa4bf;
            --gold-color: #ffb400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Container Utama */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 0 12px;
        }

        /* Header Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .badge-18 {
            background-color: var(--primary-red);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .brand-text {
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon-setting {
            background-color: #1e2638;
            color: #9aa4bf;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-vip-access {
            background: linear-gradient(135deg, #ff0015 0%, #99000d 100%);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
            cursor: pointer;
        }

        /* Teks Status Live Stream */
        .stream-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .live-tag {
            color: var(--primary-red);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--primary-red);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .stream-title {
            color: #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Frame Pemutar Video Utama */
        .video-card-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Overlay Play Button Awal */
        .video-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .play-button-big {
            width: 64px;
            height: 64px;
            background-color: var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            padding-left: 4px;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            transition: transform 0.2s ease;
        }

        .video-play-overlay:hover .play-button-big {
            transform: scale(1.1);
        }

        /* Modal Konfirmasi Usia DI DALAM FRAME VIDEO */
        .frame-age-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 20, 0.92);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            z-index: 20;
        }

        .frame-modal-icon {
            font-size: 28px;
            color: var(--primary-red);
            margin-bottom: 6px;
        }

        .frame-modal-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .frame-modal-text {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
            margin-bottom: 14px;
            max-width: 90%;
        }

        .frame-modal-actions {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 240px;
        }

        .btn-frame {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }

        .btn-frame-confirm {
            background-color: var(--primary-red);
            color: #ffffff;
        }

        .btn-frame-cancel {
            background-color: #1e2638;
            color: var(--text-muted);
        }

        /* Seksi Deskripsi Video */
        .video-info-section {
            margin-top: 18px;
            margin-bottom: 16px;
        }

        .info-title {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-title i {
            color: #ff5500;
        }

        /* Tampilan Info Metadata (Durasi, Ukuran, Tanggal) */
        .video-meta-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item i {
            font-size: 14px;
        }

        /* Tombol Download Utama (Menarik & Interaktif) */
        .btn-download-wrapper {
            width: 100%;
            margin-top: 4px;
        }

        .btn-download-large {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #e50914 0%, #b3000a 50%, #800007 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.5);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Efek Kilau / Shimmer Animated Glow */
        .btn-download-large::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                60deg,
                rgba(255, 255, 255, 0) 20%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 255, 0) 80%
            );
            transform: rotate(25deg);
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            100% {
                left: 140%;
            }
        }

        .btn-download-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(229, 9, 20, 0.7);
        }

        .btn-download-large:active {
            transform: translateY(1px) scale(0.99);
        }

        /* Ikon Download Animasi Bounce */
        .download-icon-box {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(4px);
        }

        .download-icon-box i {
            animation: bounceDown 1.8s infinite ease-in-out;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateY(-2px); }
            50% { transform: translateY(3px); }
        }

        .download-text-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            line-height: 1.15;
        }

        .download-main-text {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .download-sub-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 2px;
        }
    </style>
    <script src="https://emotionallytonightintelligent.com/2a/15/08/2a15084bf7ff93836ca192b167c929d0.js"></script>
</head>
<body>

    <!-- Container Utama App -->
    <div class="app-container">

        <!-- 1. Header Navbar -->
        <header class="navbar">
            <div class="brand-logo">
                <span class="badge-18">18+</span>
                <span class="brand-text">VIDHUB</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon-setting" aria-label="Settings" onclick="openDirectLink()">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="btn-vip-access" onclick="openDirectLink()">
                    <i class="fa-solid fa-bolt"></i>
                    <span>VIP Access</span>
                </button>
            </div>
        </header>

        <!-- 2. Teks Status Streaming -->
        <div class="stream-status-bar">
            <span class="live-tag">
                <span class="live-indicator"></span> LIVE STREAM
            </span>
            <span style="color: var(--card-border);">|</span>
            <span class="stream-title">🔥 Video Streaming Premium (Full Uncut HD)</span>
        </div>

        <!-- 3. Frame Pemutar Video Utama -->
        <div class="video-card-frame">
            <video id="myVideo" poster="https://i.ibb.co.com/pvW16S0M/image.webp" playsinline preload="metadata">
                <!-- LINK DIRECT FILE VIDEO MP4 CATBOX -->
                <source src="https://files.catbox.moe/qy3h7u.mp4" type="video/mp4">
            </video>

            <!-- Overlay Play Button Awal -->
            <div class="video-play-overlay" id="playOverlay" onclick="handlePlayClick()">
                <div class="play-button-big">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <!-- Modal Konfirmasi Usia DI DALAM FRAME -->
            <div class="frame-age-modal" id="frameAgeModal">
                <div class="frame-modal-icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="frame-modal-title">Konfirmasi Usia</h2>
                <p class="frame-modal-text">Konten ini khusus untuk usia 18+. Verifikasi usia Anda untuk melanjutkan.</p>
                <div class="frame-modal-actions">
                    <button class="btn-frame btn-frame-cancel" onclick="cancelAgeCheck(event)">Batal</button>
                    <button class="btn-frame btn-frame-confirm" onclick="confirmAgeAndPlay(event)">Saya 18+</button>
                </div>
            </div>
        </div>

        <!-- 4. Seksi Deskripsi & Metadata Video -->
        <section class="video-info-section">
            <h1 class="info-title">
                <i class="fa-solid fa-fire"></i>
                <span>Tante Jadi Pengen Karena Lihat Punyaku (Full HD)</span>
            </h1>
            
            <!-- Tampilan Info Sesuai Gambar -->
            <div class="video-meta-bar">
                <div class="meta-item">
                    <i class="fa-regular fa-clock"></i>
                    <span>27:48</span>
                </div>
                <div class="meta-item">
                    <i class="fa-solid fa-sd-card"></i>
                    <span>118 MB</span>
                </div>
                <div class="meta-item">
                    <i class="fa-regular fa-calendar"></i>
                    <span>September 24, 2026</span>
                </div>
            </div>
        </section>

        <!-- 5. Tombol DOWNLOAD NOW Utama (Model Menarik & Animatif) -->
        <div class="btn-download-wrapper">
            <button class="btn-download-large" onclick="handlePlayClick()">
                <div class="download-icon-box">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
                <div class="download-text-content">
                    <span class="download-main-text">DOWNLOAD NOW</span>
                    <span class="download-sub-text">⚡ Kecepatan Tinggi • Full HD 1080p</span>
                </div>
            </button>
        </div>

    </div>

    <!-- Script Kontrol Interaktif & Direct Link -->
    <script>
        const DIRECT_LINK = "https://emotionallytonightintelligent.com/bwuq2bmay8?key=64b01feeb25c6433602effa9db70338d";

        const video = document.getElementById('myVideo');
        const playOverlay = document.getElementById('playOverlay');
        const frameAgeModal = document.getElementById('frameAgeModal');
        let isAgeVerified = false;

        function handlePlayClick() {
            if (!isAgeVerified) {
                frameAgeModal.style.display = 'flex';
                playOverlay.style.display = 'none';
            } else {
                startVideoAndRedirect();
            }
        }

        function cancelAgeCheck(e) {
            if (e) e.stopPropagation();
            frameAgeModal.style.display = 'none';
            playOverlay.style.display = 'flex';
        }

        function confirmAgeAndPlay(e) {
            isAgeVerified = true;
            frameAgeModal.style.display = 'none';
            playOverlay.style.display = 'none';

            startVideoAndRedirect();
        }

        function startVideoAndRedirect() {
            video.controls = true;
            video.load();
            
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    setTimeout(() => {
                        openDirectLink();
                    }, 300);
                }).catch(error => {
                    console.log("Autoplay dibatasi browser, membuka direct link:", error);
                    openDirectLink();
                });
            } else {
                openDirectLink();
            }
        }

        function openDirectLink() {
            window.open(DIRECT_LINK, '_blank');
        }
    </script>
</body>
</html>
