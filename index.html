<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodStream Pro Style - Streaming & Download</title>

    <!-- OPTIMASI PRELOAD POSTER -->
    <link rel="preload" as="image" href="https://i.ibb.co/wNbGw8yF/IMG-20260928-162234.jpg" fetchpriority="high">

    <!-- SCRIPT POPUNDER ADSTERRA PERTAMA -->
    <script src="https://emotionallytonightintelligent.com/2a/15/08/2a15084bf7ff93836ca192b167c929d0.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            -webkit-user-select: none;
            user-select: none;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            padding: 10px;
        }

        .video-card {
            background-color: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
        }

        /* Pembungkus Video & Poster */
        .video-player-wrapper {
            background-color: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .video-player-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: filter 0.3s ease;
        }

        /* Efek Video Mengeblur Saat Paused di Belakang Pop-up Usia */
        .video-player-wrapper.blur-video video {
            filter: blur(10px);
            -webkit-filter: blur(10px);
        }

        /* Lapisan Poster & Tombol Play */
        .poster-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .poster-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Efek Gelap Transparan di Atas Poster */
        .poster-overlay::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 11;
        }

        /* Tombol Play Besar Khas Doodstream */
        .play-button {
            position: relative;
            z-index: 12;
            width: 70px;
            height: 70px;
            background-color: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
            transition: transform 0.2s ease;
        }

        .play-button:hover {
            transform: scale(1.1);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 16px solid transparent;
            border-left: 26px solid #fff;
            border-bottom: 16px solid transparent;
            margin-left: 5px;
        }

        /* Animasi Tombol Play */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Sembunyikan Poster Saat Dimainkan */
        .video-player-wrapper.playing .poster-overlay {
            display: none;
        }

        /* LAPISAN TRANSPARAN TRIGGER POPUNDER */
        .ad-click-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 20;
            cursor: pointer;
            background: rgba(0, 0, 0, 0);
        }

        /* MODAL KONFIRMASI USIA */
        .age-modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .age-modal-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
        }

        .age-badge {
            background: #e50914;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 8px auto;
        }

        .age-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #fff;
        }

        .age-desc {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .age-btn {
            width: 100%;
            padding: 9px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .age-btn:hover {
            background: #218838;
        }
        
        .age-btn:active {
            transform: scale(0.97);
        }

        /* Bagian Informasi Video */
        .video-info {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .video-title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .video-channel {
            color: #aaa;
            font-size: 13px;
            display: block;
        }

        .video-stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 12px;
        }

        .stat-item svg {
            width: 14px;
            height: 14px;
            fill: #888;
            margin-right: 5px;
        }
        
        /* Tombol Download */
        .download-section {
            padding: 15px;
        }

        .btn-download {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0ad4e;
            color: #000;
            text-decoration: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-download:hover { background-color: #ec971f; }
        .btn-download:active { transform: scale(0.98); }

        @media (max-width: 480px) {
            .main-container { margin-top: 5px; padding: 6px; }
            .video-title { font-size: 15px; }
            .age-modal-card { padding: 12px; }
            .age-title { font-size: 13px; }
            .age-desc { font-size: 10px; margin-bottom: 8px; }
            .age-btn { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-card">
            
            <!-- AREA VIDEO PLAYER -->
            <div class="video-player-wrapper" id="videoWrapper">
                
                <!-- Lapisan Transparan Trigger Popunder #1 -->
                <div class="ad-click-layer" id="adClickLayer"></div>

                <!-- MODAL KONFIRMASI USIA -->
                <div class="age-modal-overlay" id="ageModal">
                    <div class="age-modal-card">
                        <div class="age-badge">18+</div>
                        <div class="age-title">Peringatan Usia</div>
                        <div class="age-desc">Konten ini khusus untuk 18 tahun ke atas. Konfirmasi usia untuk menonton.</div>
                        <button class="age-btn" id="confirmAgeBtn">SAYA BERUSIA 18 TAHUN +</button>
                    </div>
                </div>

                <!-- Poster Sampul -->
                <div class="poster-overlay" id="posterOverlay">
                    <img id="posterImg" src="" alt="Poster Video" fetchpriority="high" loading="eager">
                    <div class="play-button">
                        <div class="play-icon"></div>
                    </div>
                </div>

                <!-- Pemutar Video HTML5 (preload = none) -->
                <video id="myVideo" controls preload="none">
                    <source id="videoSource" src="" type="video/mp4">
                    Browser Anda tidak mendukung pemutar video HTML5.
                </video>
            </div>

            <!-- METADATA & DESKRIPSI -->
            <div class="video-info">
                <span class="video-title">Hadiah dari Ibu tiri. Untukmu yang kini telah dewasa</span>
                <span class="video-channel">@VividCinema</span>
                
                <div class="video-stats">
                    <div class="stat-item">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                        2:22:48
                    </div>
                    <div class="stat-item">
                        <svg viewBox="0 0 24 24"><path d="M18 2h-8L4.02 8 4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-6 6h-2V4h2v4zm3 0h-2V4h2v4zm3 0h-2V4h2v4z"/></svg>
                        1,47 GB
                    </div>
                    <div class="stat-item">
                        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                        September 24, 2026
                    </div>
                </div>
            </div>

            <!-- TOMBOL DOWNLOAD -->
            <div class="download-section">
                <a id="downloadBtn" href="#" target="_blank" class="btn-download">
                    Download Now &nbsp; ➔
                </a>
            </div>

        </div>
    </div>

    <script>
        const CONFIG = {
            posterUrl: "https://i.ibb.co/wNbGw8yF/IMG-20260928-162234.jpg",
            videoUrl: "https://stream.vidhosting.in/videos/29164b1a.mp4",
            // Direct Link Iklan Kedua:
            directLinkPopunder2: "https://emotionallytonightintelligent.com/bwuq2bmay8?key=2a15084bf7ff93836ca192b167c929d0"
        };

        // Elemen DOM
        const posterImg = document.getElementById('posterImg');
        const myVideo = document.getElementById('myVideo');
        const videoSource = document.getElementById('videoSource');
        const videoWrapper = document.getElementById('videoWrapper');
        const downloadBtn = document.getElementById('downloadBtn');
        const adClickLayer = document.getElementById('adClickLayer');
        const ageModal = document.getElementById('ageModal');
        const confirmAgeBtn = document.getElementById('confirmAgeBtn');

        // Pemuatan data
        posterImg.src = CONFIG.posterUrl;
        videoSource.src = CONFIG.videoUrl;
        downloadBtn.href = CONFIG.videoUrl;

        // 1. Klik pertama memicu Popunder Adsterra (diberi jeda 100ms agar skrip Adsterra sempat menangkap event klik)
        adClickLayer.addEventListener('click', function() {
            setTimeout(function() {
                videoWrapper.classList.add('playing');
                adClickLayer.style.display = 'none';

                videoWrapper.classList.add('blur-video');
                ageModal.style.display = 'flex';
            }, 100);
        });

        // 2. Klik kedua (konfirmasi usia) memicu Direct Link Iklan #2 & memutar video
        confirmAgeBtn.addEventListener('click', function(e) {
            e.stopPropagation();

            if (CONFIG.directLinkPopunder2 && CONFIG.directLinkPopunder2 !== "https://contoh-link-iklan-kedua.com") {
                window.open(CONFIG.directLinkPopunder2, '_blank');
            }

            ageModal.style.display = 'none';
            videoWrapper.classList.remove('blur-video');

            myVideo.load();
            myVideo.play();
        });

        // Proteksi Matikan Klik Kanan & Shortcut Inspect Element
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>

</body>
</html>
